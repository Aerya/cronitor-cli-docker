name: Validation Docker PR

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "docker-compose.yml"
      - "compose.yml"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker-pr.yml"

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/amd64,linux/arm64,linux/arm/v7
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer la version amont
        run: echo "VERSION=$(curl -fsSL https://api.github.com/repos/cronitorio/cronitor-cli/releases/latest | jq -r .tag_name)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Construire sans publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          pull: true
          build-args: VERSION=${{ env.VERSION }}
